services:
  # Build-only services: they produce the sandbox images the API runs code in, then exit.
  runner-python:
    image: theshire/runner-python:latest
    build: runner/images/python
    entrypoint: ['true']
    network_mode: none
    restart: 'no'

  runner-node:
    image: theshire/runner-node:latest
    build: runner/images/node
    entrypoint: ['true']
    network_mode: none
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      LOG_LEVEL: info
      # Local development values. Production must set its own long random COOKIE_SECRET.
      COOKIE_SECRET: ${COOKIE_SECRET:-local-compose-cookie-secret-not-for-production}
      COOKIE_SECURE: 'false'
      # Requests arrive through the web container's /api proxy; use its X-Forwarded-For.
      TRUST_PROXY: '1'
    ports:
      - '4000:4000'
    # Lets the API start sibling sandbox containers on the host daemon. This is root-equivalent
    # access to the host: never expose this setup publicly as-is (see docs/security.md).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - api-data:/app/data
    depends_on:
      runner-python:
        condition: service_completed_successfully
      runner-node:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    environment:
      API_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  api-data:
